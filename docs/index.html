            --loader-accent: #3498db;
            --link-color: #3498db;
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #1a1a1a;
                --text-color: #e0e0e0;
                --loader-bg: #333;
                --loader-accent: #5ab0ee;

        }

        body {

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            /* 顶部对齐 */
            min-height: 120vh;
            /* 增加页面高度 */
            margin: 0;
            background-color: var(--bg-color);
            color: var(--text-color);
            transition: background-color 0.3s, color 0.3s;
            position: relative;
            /* 为 fixed 定位提供相对定位的父元素 */
            padding-top: 60px;
            /* 预留顶部浮动面板空间 */
        }

        .loader-container {
            position: fixed;
            top: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .loader {
            border: 4px solid var(--loader-bg);
            border-top: 4px solid var(--loader-accent);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .message {
            text-align: center;
            margin-bottom: 20px;
        }

        .manual-link {
            color: var(--link-color);
            text-decoration: none;
        }

        .manual-link:hover {
            text-decoration: underline;
        }

        .description {
            max-width: 600px;
            text-align: center;
            margin: 20px;
            line-height: 1.6;
            opacity: 0.9;
        }

        .features {
            list-style: none;
            padding: 0;
            margin: 20px 0;
            text-align: center;
        }

        .features li {
            margin: 12px 0;
            opacity: 0.9;
            line-height: 1.5;
        }

        .category {
            margin: 25px 0;
            text-align: left;
            max-width: 800px;
            padding: 0 20px;
        }

        .category h3 {
            color: var(--text-color);
            margin-bottom: 10px;
        }

        .content {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            line-height: 1.8;
        }

        .title {
            font-size: 2em;
            margin-bottom: 1em;
            text-align: center;
            color: var(--text-color);
        }

        .section {
            margin: 2em 0;
            padding: 1em;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.05);
        }

        .highlight {
            color: var(--loader-accent);
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 15px;
        }

        .redirect-btn,
        .cancel-btn {
            padding: 8px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: opacity 0.3s;
            font-size: 1em;
        }

        .redirect-btn {
            background: var(--loader-accent);
            color: white;
        }

        .cancel-btn {
            background: #666;
            color: white;
        }

        .redirect-btn:hover,
        .cancel-btn:hover {
            opacity: 0.8;
        }

        .message-box {
            position: fixed;
            bottom: 20px;
            right: 20px;
            padding: 10px 20px;
            border-radius: 5px;
            background: rgba(0, 0, 0, 0.8);
            color: white;
            display: none;
            z-index: 1000;
        }

            const lang = navigator.language || navigator.userLanguage;
            return lang.toLowerCase().startsWith('zh') ? 'zh' : 'en';

            zh: {

        let countdownTimer;
        let remainingTime = 10;
        let lang;
        let t;
        let isRedirectCanceled = false; // 添加一个标志位

        function startCountdown() {
            remainingTime = 10;
            updateCountdown();
            countdownTimer = setInterval(() => {
                remainingTime--;
                updateCountdown();

                if (remainingTime <= 0) {
                    clearInterval(countdownTimer);
                    redirectToFixer();
                }
            }, 1000);
        }

        function updateCountdown() {
            const countdownElement = document.getElementById('countdown');
            countdownElement.textContent = t.countdown.replace('{0}', remainingTime);
        }

        function redirectToFixer() {
            window.location.href = `fix/workflow_fixer.html?lang=${lang}`;
        }

        function cancelRedirect() {
            clearInterval(countdownTimer);
            isRedirectCanceled = true; // 设置取消标志位
            const messageBox = document.getElementById('messageBox');
            messageBox.textContent = t.redirectCanceled;
            messageBox.style.display = 'block';
            setTimeout(() => {
                messageBox.style.display = 'none';
            }, 3000);

            // 更新按钮状态
            const redirectButton = document.getElementById('redirect-btn');
            redirectButton.textContent = t.immediateRedirect;
            redirectButton.onclick = redirectToFixer; // 修改点击事件
            const cancelButton = document.getElementById('cancel-btn');
            cancelButton.style.display = 'none'; // 隐藏取消按钮

            // 隐藏倒计时
            document.getElementById('countdown').style.display = 'none';
            // 隐藏 loading 图标
            document.querySelector('.loader').style.display = 'none';
        }

        window.onload = function () {
            lang = detectLanguage();
            t = translations[lang];

            // 更新页面文本
            document.title = `PaintingCoder Utils - ${t.title}`;
            // document.querySelector('.description').textContent = t.description;

            // 更新页面内容
            document.getElementById('mainContent').innerHTML = t.mainContent;

            // 更新手动跳转链接
            const manualLink = document.querySelector('.manual-link');
            if (manualLink) {
                manualLink.href = `fix/workflow_fixer.html?lang=${lang}`;
            }

            // 更新按钮文字
            const redirectButton = document.getElementById('redirect-btn');
            redirectButton.textContent = t.immediateRedirect;
            const cancelButton = document.getElementById('cancel-btn');
            cancelButton.textContent = t.cancelRedirect;

            startCountdown();
            updateCountdown(); // 立即更新一次倒计时
        }

</body>
